apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector-node
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: observability
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.108.0"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  values:
    mode: daemonset
    presets:
      logsCollection:
        enabled: true
        includeCollectorLogs: false
      hostMetrics:
        enabled: true
      kubernetesAttributes:
        enabled: true
    config:
      exporters:
        debug: {}
      service:
        pipelines:
          metrics:
            exporters:
              - debug
          logs:
            exporters:
              - debug
