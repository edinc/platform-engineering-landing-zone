apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector-node
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: observability
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.108.0"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  values:
    image:
      repository: otel/opentelemetry-collector-contrib
    mode: daemonset
    presets:
      logsCollection:
        enabled: true
        includeCollectorLogs: false
      hostMetrics:
        enabled: true
      kubernetesAttributes:
        enabled: true
    config:
      exporters:
        debug: {}
      processors:
        resource/platform:
          attributes:
            - action: upsert
              key: deployment.environment
              value: ${platform_profile}
            - action: upsert
              key: service.namespace
              value: platform
      service:
        pipelines:
          metrics:
            processors:
              - resource/platform
            exporters:
              - debug
          logs:
            processors:
              - resource/platform
            exporters:
              - debug
