apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: external-dns
  chart:
    spec:
      chart: external-dns
      version: "1.15.2"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  values:
    provider:
      name: azure
    sources:
      - ingress
      - service
    policy: sync
    txtOwnerId: platform-cluster
    domainFilters:
      - ${platform_root_domain}
    annotationFilter: platform.example.io/external-dns in (enabled)
    podLabels:
      azure.workload.identity/use: "true"
    serviceAccount:
      name: external-dns
      annotations:
        azure.workload.identity/client-id: ${external_dns_client_id}
        azure.workload.identity/tenant-id: ${platform_tenant_id}
    extraArgs:
      - --azure-resource-group=${azure_dns_resource_group_name}
      - --azure-subscription-id=${platform_subscription_id}
      - --azure-user-assigned-identity-client-id=${external_dns_client_id}
    extraVolumes:
      - name: azure-config
        configMap:
          name: external-dns-azure-config
    extraVolumeMounts:
      - name: azure-config
        mountPath: /etc/kubernetes
        readOnly: true
