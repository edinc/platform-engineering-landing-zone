apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kyverno
  chart:
    spec:
      chart: kyverno
      version: "3.3.4"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  values:
    admissionController:
      replicas: 3
      container:
        extraEnvVars:
          - name: AZURE_CLIENT_ID
            value: ${aks_kubelet_client_id}
      serviceMonitor:
        enabled: false
    backgroundController:
      replicas: 2
    cleanupController:
      replicas: 2
    reportsController:
      replicas: 2
      extraEnvVars:
        - name: AZURE_CLIENT_ID
          value: ${aks_kubelet_client_id}
    features:
      admissionReports:
        enabled: true
