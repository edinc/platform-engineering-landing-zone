apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: keda
  chart:
    spec:
      chart: keda
      version: "2.16.1"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
  values:
    crds:
      install: true
    podIdentity:
      azureWorkload:
        enabled: true
    prometheus:
      metricServer:
        enabled: false
      operator:
        enabled: false
