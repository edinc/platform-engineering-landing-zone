apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: "v1.16.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  values:
    crds:
      enabled: true
    podLabels:
      azure.workload.identity/use: "true"
    serviceAccount:
      name: cert-manager
      annotations:
        azure.workload.identity/client-id: ${cert_manager_client_id}
        azure.workload.identity/tenant-id: ${platform_tenant_id}
    extraArgs:
      - --cluster-resource-namespace=cert-manager
