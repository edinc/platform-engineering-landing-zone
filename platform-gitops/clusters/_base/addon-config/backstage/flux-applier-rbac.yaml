apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-applier
  namespace: backstage
  labels:
    app: flux
    team: platform-engineering
    costCenter: cc-platform
    dataClassification: internal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-helm-storage
  namespace: backstage
  labels:
    app: flux
    team: platform-engineering
    costCenter: cc-platform
    dataClassification: internal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform:tenant-helm-release-storage
subjects:
  - kind: ServiceAccount
    name: flux-applier
    namespace: backstage
