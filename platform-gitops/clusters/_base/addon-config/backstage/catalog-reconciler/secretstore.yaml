apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: backstage-catalog-reconciler-key-vault
  namespace: backstage
  labels:
    app: backstage-catalog-reconciler
    team: platform-engineering
    costCenter: cc-platform
    dataClassification: internal
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://${platform_key_vault_name}.vault.azure.net
      tenantId: ${platform_tenant_id}
      serviceAccountRef:
        name: backstage-catalog-reconciler
        namespace: backstage
