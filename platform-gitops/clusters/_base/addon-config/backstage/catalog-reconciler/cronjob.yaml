apiVersion: batch/v1
kind: CronJob
metadata:
  name: backstage-catalog-reconciler
  namespace: backstage
  labels:
    app: backstage-catalog-reconciler
    team: platform-engineering
    costCenter: cc-platform
    dataClassification: internal
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: backstage-catalog-reconciler
            azure.workload.identity/use: "true"
            team: platform-engineering
            costCenter: cc-platform
            dataClassification: internal
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: backstage-catalog-reconciler
          restartPolicy: Never
          containers:
            - name: reconciler
              image: ${backstage_catalog_reconciler_image_repository}@${backstage_catalog_reconciler_image_digest}
              imagePullPolicy: IfNotPresent
              env:
                - name: BACKSTAGE_BASE_URL
                  value: https://${platform_profile}.backstage.${platform_root_domain}
                - name: GITHUB_ORG
                  value: ${github_owner}
                - name: PLATFORM_ENV
                  value: ${platform_profile}
                - name: BACKSTAGE_SERVICE_TOKEN_FILE
                  value: /var/run/secrets/backstage/token
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: backstage-catalog-reconciler
                      key: github-token
                - name: TEAMS_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: backstage-catalog-reconciler
                      key: teams-webhook-url
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsGroup: 65532
                runAsUser: 65532
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backstage-token
                  mountPath: /var/run/secrets/backstage
                  readOnly: true
          volumes:
            - name: backstage-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: backstage
                      expirationSeconds: 600
                      path: token
