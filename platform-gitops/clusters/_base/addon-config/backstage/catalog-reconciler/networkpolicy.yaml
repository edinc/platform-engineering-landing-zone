apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backstage-catalog-reconciler
  namespace: backstage
  labels:
    app: backstage-catalog-reconciler
    team: platform-engineering
    costCenter: cc-platform
    dataClassification: internal
spec:
  podSelector:
    matchLabels:
      app: backstage-catalog-reconciler
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
