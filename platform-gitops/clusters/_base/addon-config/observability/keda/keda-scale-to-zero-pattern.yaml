apiVersion: v1
kind: ConfigMap
metadata:
  name: keda-scale-to-zero-pattern
  namespace: observability
  labels:
    app: keda
    team: platform-engineering
    costCenter: cc-platform
    dataClassification: internal
data:
  scaledobject.yaml: |
    apiVersion: keda.sh/v1alpha1
    kind: ScaledObject
    metadata:
      name: <service-name>
      namespace: <workload-namespace>
      labels:
        team: <team>
        product: <product>
        costCenter: <cost-center>
        dataClassification: internal
    spec:
      scaleTargetRef:
        name: <service-name>
      minReplicaCount: 0
      maxReplicaCount: 10
      pollingInterval: 30
      cooldownPeriod: 300
      triggers:
        - type: prometheus
          metadata:
            serverAddress: https://prometheus-query.platform.internal
            metricName: http_requests_per_second
            query: sum(rate(http_server_requests_total{namespace="<workload-namespace>",service="<service-name>"}[2m]))
            threshold: "5"
