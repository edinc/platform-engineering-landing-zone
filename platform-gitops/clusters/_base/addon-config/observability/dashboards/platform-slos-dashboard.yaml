apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform-slos
  namespace: observability
  labels:
    app: managed-grafana
    team: platform-engineering
    costCenter: cc-platform
    dataClassification: internal
    grafana_dashboard: "1"
data:
  platform-slos.json: |
    {
      "title": "Platform SLOs",
      "schemaVersion": 39,
      "tags": ["platform", "slo", "stage-08"],
      "panels": [
        {
          "type": "stat",
          "title": "Backstage availability",
          "targets": [
            {
              "expr": "1 - (sum(rate(nginx_ingress_controller_requests{exported_service=\"backstage\",status=~\"5..\"}[30d])) / sum(rate(nginx_ingress_controller_requests{exported_service=\"backstage\"}[30d])))"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Flux reconciliation p95 latency",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(gotk_reconcile_duration_seconds_bucket[5m])))"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Signature-verify mean overhead",
          "targets": [
            {
              "expr": "sum(rate(kyverno_admission_review_duration_seconds_sum{policy_name=\"verify-cosign-signatures\"}[5m])) / sum(rate(kyverno_admission_review_duration_seconds_count{policy_name=\"verify-cosign-signatures\"}[5m]))"
            }
          ]
        },
        {
          "type": "table",
          "title": "Current burn rates",
          "targets": [
            {
              "expr": "sum(rate(apiserver_request_total{code=~\"5..\"}[5m])) / sum(rate(apiserver_request_total[5m]))"
            }
          ]
        }
      ]
    }
