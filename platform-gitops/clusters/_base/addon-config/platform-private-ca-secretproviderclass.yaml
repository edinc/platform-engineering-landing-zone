apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: platform-private-ca
  namespace: cert-manager
  annotations:
    platform.example.io/rotation-contract: docs/runbooks/secret-rotation.md
spec:
  provider: azure
  secretObjects:
    - secretName: platform-private-ca
      type: kubernetes.io/tls
      data:
        - objectName: platform-private-ca-crt
          key: tls.crt
        - objectName: platform-private-ca-key
          key: tls.key
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: ${cert_manager_client_id}
    keyvaultName: ${platform_key_vault_name}
    tenantId: ${platform_tenant_id}
    objects: |
      array:
        - |
          objectName: platform-private-ca-crt
          objectType: secret
        - |
          objectName: platform-private-ca-key
          objectType: secret
