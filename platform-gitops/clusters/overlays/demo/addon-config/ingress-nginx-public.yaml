apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx-public
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: ingress-nginx-public
  chart:
    spec:
      chart: ingress-nginx
      version: "4.11.3"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  values:
    fullnameOverride: ingress-nginx-public
    rbac:
      scope: true
    controller:
      replicaCount: ${backstage_public_ingress_controller_replicas}
      electionID: ingress-nginx-public-leader
      extraArgs:
        default-ssl-certificate: ingress-nginx-public/backstage-public-tls
      watchIngressWithoutClass: false
      ingressClassByName: true
      ingressClass: backstage-public
      ingressClassResource:
        name: backstage-public
        controllerValue: platform.example.com/backstage-public-ingress-nginx
      scope:
        enabled: true
        namespace: ingress-nginx-public
      service:
        enabled: ${backstage_public_ingress_enabled}
        annotations:
          service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
          service.beta.kubernetes.io/azure-pip-name: ${backstage_public_ingress_public_ip_name}
          service.beta.kubernetes.io/azure-load-balancer-resource-group: ${backstage_public_ingress_resource_group}
        externalTrafficPolicy: Local
        nodePorts:
          http: 32080
          https: 32443
        healthCheckNodePort: 32081
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false
      admissionWebhooks:
        enabled: false
