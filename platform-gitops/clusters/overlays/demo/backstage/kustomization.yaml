apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../_base/addon-config/backstage
patches:
  - target:
      kind: HelmRelease
      name: backstage
    patch: |-
      - op: replace
        path: /spec/values/replicaCount
        value: 1
      - op: add
        path: /spec/values/autoscaling
        value:
          enabled: true
          minReplicas: 1
          maxReplicas: 2
          targetCPUUtilizationPercentage: 70
