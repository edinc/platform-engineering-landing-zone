apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: backstage-public-tls
  namespace: ingress-nginx-public
  labels:
    app: ingress-nginx-public
    team: platform-engineering
    costCenter: cc-platform
    dataClassification: internal
spec:
  secretName: backstage-public-tls
  dnsNames:
    - ${backstage_public_ingress_host}
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-http01
