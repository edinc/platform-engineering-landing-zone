apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: public-backstage
  namespace: flux-system
  labels:
    app: backstage
    team: platform-engineering
    costCenter: cc-platform
    dataClassification: internal
spec:
  interval: 5m
  path: ./${cluster_state_root_path}/public-backstage
  postBuild:
    substitute:
      backstage_public_ingress_allowed_cidr: ${backstage_public_ingress_allowed_cidr}
      backstage_public_ingress_external_dns: ${backstage_public_ingress_external_dns}
      platform_profile: ${platform_profile}
      platform_root_domain: ${platform_root_domain}
  prune: true
  retryInterval: 1m
  serviceAccountName: platform-reconciler
  sourceRef:
    kind: GitRepository
    name: platform-cluster-state
  timeout: 5m
  wait: false
