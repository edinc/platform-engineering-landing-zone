apiVersion: platform.example.io/v1alpha1
kind: TeamOnboardingRequest
metadata:
  name: payments
  labels:
    platform.example.io/requester: backstage
spec:
  team: payments
  product: checkout
  costCenter: cc-payments
  onCallRotationId: pd-payments-primary
  githubTeam: app-team-payments
  dataClassification: confidential
  environments:
    - demo
    - nonprod
    - prod
  regions:
    - swedencentral
  github:
    owner: edinc
    repositoryPermissions:
      platform-engineering-landing-zone: pull
  namespace:
    serviceAccountName: checkout-api
    resourceQuota:
      cpuRequests: "2000m"
      memoryRequests: 4Gi
      cpuLimits: "4000m"
      memoryLimits: 8Gi
      pods: 50
    egressAllowlist:
      cidrs:
        - 10.30.0.0/16
