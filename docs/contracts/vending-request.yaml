      addressSpace:
        - 10.64.0.0/20
      hubNetworkResourceId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-pe-nonprod-hub-sec/providers/Microsoft.Network/virtualNetworks/vnet-pe-nonprod-hub-sec
