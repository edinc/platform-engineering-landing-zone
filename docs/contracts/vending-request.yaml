apiVersion: platform.example.io/v1alpha1
kind: SubscriptionVendingRequest
metadata:
  name: payments-nonprod-subscription
  labels:
    platform.example.io/requester: backstage
spec:
  team: payments
  product: checkout
  costCenter: cc-payments
  onCallRotationId: pd-payments-primary
  dataClassification: confidential
  environment: nonprod
  regions:
    - swedencentral
  tags:
    owner: payments
    costCenter: cc-payments
    product: checkout
    dataClassification: confidential
    confidentiality: medium
    managedBy: terraform
    repo: edinc/platform-engineering-landing-zone
  budget:
    amount: 500
    currency: EUR
    startDate: "2026-07-01T00:00:00Z"
    endDate: "2027-07-01T00:00:00Z"
