apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-tenant-reconciler-serviceaccounts
  annotations:
    policies.kyverno.io/title: Restrict tenant reconciler service accounts
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-pod-helm-reconciler-serviceaccount
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - flux-system
                - cert-manager
                - external-dns
                - external-secrets
                - kyverno
                - azureserviceoperator-system
                - keda
                - ingress-nginx
                - observability
      validate:
        message: Tenant workloads must not mount vended Helm reconciler service accounts.
        pattern:
          spec:
            =(serviceAccountName): "!helm-*"
    - name: disallow-controller-helm-reconciler-serviceaccount
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - ReplicaSet
                - Job
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - flux-system
                - cert-manager
                - external-dns
                - external-secrets
                - kyverno
                - azureserviceoperator-system
                - keda
                - ingress-nginx
                - observability
      validate:
        message: Tenant workload controllers must not mount vended Helm reconciler service accounts.
        pattern:
          spec:
            template:
              spec:
                =(serviceAccountName): "!helm-*"
    - name: disallow-cronjob-helm-reconciler-serviceaccount
      match:
        any:
          - resources:
              kinds:
                - CronJob
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - flux-system
                - cert-manager
                - external-dns
                - external-secrets
                - kyverno
                - azureserviceoperator-system
                - keda
                - ingress-nginx
                - observability
      validate:
        message: Tenant CronJobs must not mount vended Helm reconciler service accounts.
        pattern:
          spec:
            jobTemplate:
              spec:
                template:
                  spec:
                    =(serviceAccountName): "!helm-*"
