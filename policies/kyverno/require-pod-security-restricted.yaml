apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-security-restricted
  annotations:
    policies.kyverno.io/title: Require Pod Security restricted labels
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-restricted-psa
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              names:
                - aks-command
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - cert-manager
                - ingress-nginx
                - kyverno
                - observability
                - azureserviceoperator-system
      validate:
        message: Workload namespaces must enforce Pod Security Admission restricted.
        pattern:
          metadata:
            labels:
              pod-security.kubernetes.io/enforce: restricted
              pod-security.kubernetes.io/audit: restricted
              pod-security.kubernetes.io/warn: restricted
