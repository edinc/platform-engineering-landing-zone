apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: checkout-service-account
  namespace: team-payments
spec:
  interval: 5m
  url: oci://${platform_acr_login_server}/helm/checkout
  provider: azure
  serviceAccountName: app
  ref:
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token.actions.githubusercontent.com$
        subject: ^https://github.com/${github_owner}/${platform_repository_name}/\.github/workflows/helm-publish\.yml@refs/heads/main$
