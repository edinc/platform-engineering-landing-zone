apiVersion: v1
kind: Pod
metadata:
  name: pod-privileged
  labels:
    app: sample
    team: platform-engineering
    costCenter: cc-platform
    dataClassification: internal
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      securityContext:
        privileged: true
        readOnlyRootFilesystem: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
