apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-helm-serviceaccount
  labels:
    app: sample
    team: platform-engineering
    costCenter: cc-platform
    dataClassification: internal
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: sample
            team: platform-engineering
            costCenter: cc-platform
            dataClassification: internal
        spec:
          serviceAccountName: helm-app
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pause
              image: registry.k8s.io/pause:3.10
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                privileged: false
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
