apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-default-network-policy-v3
  annotations:
    policies.kyverno.io/title: Generate default NetworkPolicy
    policies.kyverno.io/category: Network Security
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: generate-default-deny
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              names:
                - aks-command
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - cert-manager
                - external-dns
                - external-secrets
                - kyverno
                - azureserviceoperator-system
                - backstage
                - keda
                - ingress-nginx
                - ingress-nginx-public
                - observability
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          metadata:
            labels:
              app: network-policy
              team: platform-engineering
              costCenter: cc-platform
              dataClassification: internal
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
              - Egress
