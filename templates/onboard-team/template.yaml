apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: onboard-team
  title: Onboard application team
  description: Create the Stage 10 team onboarding request for Entra, GitHub, Backstage ownership, namespace vending, and cost showback.
  tags:
    - stage-10
    - team-scoped
spec:
  owner: group:default/pe-platform-admins
  type: platform-onboarding
  parameters:
    - title: Team ownership
      required:
        - teamName
        - productName
        - costCenter
        - onCallRotationId
        - githubTeam
        - dataClassification
      properties:
        teamName:
          title: Team name
          type: string
          description: DNS-safe team slug.
          pattern: "^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$"
          ui:autofocus: true
        productName:
          title: Product name
          type: string
          description: Primary product slug used for cost and catalog metadata.
          maxLength: 22
          pattern: "^[a-z0-9][a-z0-9-]{1,20}[a-z0-9]$"
        costCenter:
          title: Cost center
          type: string
          description: FinOps cost center tag.
          pattern: "^cc-[a-z0-9-]{2,32}$"
        onCallRotationId:
          title: On-call rotation ID
          type: string
          description: PagerDuty, OpsGenie, or equivalent rotation identifier.
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{1,126}[A-Za-z0-9]$"
        githubTeam:
          title: GitHub team
          type: string
          description: GitHub team slug; must be app-team-<team name>.
          pattern: "^app-team-[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$"
        dataClassification:
          title: Data classification
          type: string
          enum:
            - public
            - internal
            - confidential
            - restricted
    - title: Default namespace vending
      required:
        - environments
        - region
        - serviceAccountName
      properties:
        environments:
          title: Environments
          type: array
          uniqueItems: true
          default:
            - demo
            - nonprod
            - prod
          items:
            type: string
            enum:
              - demo
              - nonprod
              - prod
        region:
          title: Azure region
          type: string
          default: westeurope
        serviceAccountName:
          title: Workload service account
          type: string
          default: app
          pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
  steps:
    - id: fetch-request
      name: Render onboarding request
      action: fetch:template
      input:
        url: ./skeleton
        values:
          stage10TeamScoped: "true"
          teamName: ${{ parameters.teamName }}
          productName: ${{ parameters.productName }}
          costCenter: ${{ parameters.costCenter }}
          onCallRotationId: ${{ parameters.onCallRotationId }}
          githubTeam: ${{ parameters.githubTeam }}
          dataClassification: ${{ parameters.dataClassification }}
          environments: ${{ parameters.environments }}
          region: ${{ parameters.region }}
          serviceAccountName: ${{ parameters.serviceAccountName }}
    - id: publish-request
      name: Open onboarding PR
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=edinc&repo=platform-engineering-landing-zone
        branchName: onboard-${{ parameters.teamName }}
        title: Onboard ${{ parameters.teamName }}
        description: Stage 10 team onboarding request generated by Backstage.
        targetPath: .
  output:
    links:
      - title: Onboarding pull request
        url: ${{ steps['publish-request'].output.remoteUrl }}
