apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: "${{ values.componentId }}"
  namespace: "${{ values.namespace }}"
  labels:
    app.kubernetes.io/name: "${{ values.componentId }}"
    team: "${{ values.teamName }}"
    product: "${{ values.productName }}"
    costCenter: "${{ values.costCenter }}"
    dataClassification: "${{ values.dataClassification }}"
spec:
  scaleTargetRef:
    name: "${{ values.componentId }}"
  minReplicaCount: 0
  maxReplicaCount: ${{ values.maxReplicas }}
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: https://prometheus-query.platform.internal
        metricName: "${{ values.componentId }}_requests_per_second"
        query: sum(rate(http_server_requests_total{namespace="${{ values.namespace }}",service="${{ values.componentId }}"}[2m]))
        threshold: "${{ values.scaleThreshold }}"
