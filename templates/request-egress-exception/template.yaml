apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: request-egress-exception
  title: Request egress exception
  description: Open a reviewed PR for a time-boxed firewall and Cilium FQDN egress exception.
  tags:
    - stage-10
    - team-scoped
spec:
  owner: group:default/pe-platform-admins
  type: platform-exception
  parameters:
    - title: Exception details
      required:
        - teamName
        - productName
        - environment
        - appSelector
        - exceptionSlug
        - destinationFqdns
        - firewallPriority
        - port
        - businessJustification
        - dataClassification
        - expiresOn
      properties:
        teamName:
          title: Team name
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$"
        productName:
          title: Product name
          type: string
          maxLength: 22
          pattern: "^[a-z0-9][a-z0-9-]{1,20}[a-z0-9]$"
        environment:
          title: Environment
          type: string
          enum:
            - demo
            - nonprod
            - prod
        appSelector:
          title: Application selector
          type: string
          description: app.kubernetes.io/name value for the workload that needs the exception.
          pattern: "^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$"
        exceptionSlug:
          title: Exception slug
          description: Short slug; generated names include team and environment.
          type: string
          maxLength: 22
          pattern: "^[a-z0-9][a-z0-9-]{1,20}[a-z0-9]$"
        destinationFqdns:
          title: Destination FQDNs
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^(\\*\\.)?([a-zA-Z0-9-]+\\.)+[a-zA-Z]{2,}$"
        firewallPriority:
          title: Firewall rule collection priority
          type: integer
          description: Unique priority for this egress exception collection. Use 800-899 and verify it is not already active.
          minimum: 800
          maximum: 899
        port:
          title: Port
          type: number
          default: 443
          enum:
            - 443
        businessJustification:
          title: Business justification
          type: string
          minLength: 12
          maxLength: 240
          pattern: "^[A-Za-z0-9][A-Za-z0-9 .,;:/_()#-]{10,238}[A-Za-z0-9.]$"
        dataClassification:
          title: Data classification
          type: string
          enum:
            - public
            - internal
            - confidential
            - restricted
        expiresOn:
          title: Expiry date
          type: string
          description: ISO date, maximum 90 days from approval.
          pattern: "^20[0-9]{2}-[0-9]{2}-[0-9]{2}$"
  steps:
    - id: fetch-request
      name: Render exception patch
      action: fetch:template
      input:
        url: ./skeleton
        values:
          stage10TeamScoped: "true"
          teamName: ${{ parameters.teamName }}
          productName: ${{ parameters.productName }}
          environment: ${{ parameters.environment }}
          namespace: ${{ parameters.teamName }}-${{ parameters.productName }}-${{ parameters.environment }}
          appSelector: ${{ parameters.appSelector }}
          exceptionSlug: ${{ parameters.exceptionSlug }}
          destinationFqdns: ${{ parameters.destinationFqdns }}
          firewallPriority: ${{ parameters.firewallPriority }}
          port: ${{ parameters.port }}
          businessJustification: ${{ parameters.businessJustification }}
          dataClassification: ${{ parameters.dataClassification }}
          expiresOn: ${{ parameters.expiresOn }}
    - id: publish-request
      name: Open exception PR
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=edinc&repo=platform-engineering-landing-zone
        branchName: egress-${{ parameters.teamName }}-${{ parameters.environment }}-${{ parameters.exceptionSlug }}
        title: Request egress exception for ${{ parameters.teamName }}
        description: Stage 10 egress exception request generated by Backstage. Platform reviewers must apply the JSON patch to policies/azure/firewall/allowlist.json, add the generated Cilium policy to platform-gitops/clusters/overlays/${{ parameters.environment }}/network/egress-exceptions/kustomization.yaml, and review both changes before merge.
        targetPath: .
  output:
    links:
      - title: Egress exception pull request
        url: ${{ steps['publish-request'].output.remoteUrl }}
