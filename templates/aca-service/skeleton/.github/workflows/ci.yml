name: ACA service CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pr-validate:
    if: ${{ "${{ github.event_name == 'pull_request' }}" }}
    name: PR validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false

      - name: Install mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true
          cache: true

      - name: Build container locally
        run: docker build --pull --file Dockerfile --tag ${{ values.componentId }}:pr .

      - name: Terraform validate without backend
        run: |
          set -euo pipefail
          mise exec -- terraform -chdir=infra init -backend=false -input=false
          mise exec -- terraform -chdir=infra validate

  build:
    if: ${{ "${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}" }}
    uses: ${{ values.platformRepoOwner }}/${{ values.platformRepoName }}/.github/workflows/container-build-sign.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      image_name: apps/${{ values.repoName }}
      context: .
      dockerfile: Dockerfile
      environment: ${{ values.environment }}

  terraform:
    name: Terraform validate and apply
    if: ${{ "${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}" }}
    needs: build
    runs-on: self-hosted
    permissions:
      contents: read
      id-token: write
    environment: ${{ values.environment }}
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ '${{ vars.AZURE_CLIENT_ID }}' }}
      ARM_TENANT_ID: ${{ '${{ vars.AZURE_TENANT_ID }}' }}
      ARM_SUBSCRIPTION_ID: ${{ '${{ vars.AZURE_SUBSCRIPTION_ID }}' }}
      TFSTATE_RESOURCE_GROUP: ${{ '${{ vars.TFSTATE_RESOURCE_GROUP }}' }}
      TFSTATE_STORAGE_ACCOUNT: ${{ '${{ vars.TFSTATE_STORAGE_ACCOUNT }}' }}
      TFSTATE_CONTAINER: ${{ '${{ vars.TFSTATE_CONTAINER }}' }}
      TF_VAR_subscription_id: ${{ '${{ vars.AZURE_SUBSCRIPTION_ID }}' }}
      TF_VAR_location: ${{ '${{ vars.PLATFORM_LOCATION }}' }}
      TF_VAR_resource_group_name: ${{ '${{ vars.PLATFORM_RESOURCE_GROUP_NAME }}' }}
      TF_VAR_container_app_environment_id: ${{ '${{ vars.PLATFORM_ACA_ENVIRONMENT_ID }}' }}
      TF_VAR_acr_id: ${{ '${{ vars.PLATFORM_ACR_ID }}' }}
      TF_VAR_acr_login_server: ${{ '${{ vars.PLATFORM_ACR_LOGIN_SERVER }}' }}
      PLATFORM_ACR_NAME: ${{ '${{ vars.PLATFORM_ACR_NAME }}' }}
      TF_VAR_image_digest: ${{ '${{ needs.build.outputs.digest_ref }}' }}
      TF_VAR_queue_name: ${{ '${{ vars.PLATFORM_ACA_QUEUE_NAME }}' }}
      TF_VAR_queue_storage_account_name: ${{ '${{ vars.PLATFORM_ACA_QUEUE_STORAGE_ACCOUNT_NAME }}' }}
      TF_VAR_queue_storage_account_id: ${{ '${{ vars.PLATFORM_ACA_QUEUE_STORAGE_ACCOUNT_ID }}' }}
      DIGEST_REF: ${{ '${{ needs.build.outputs.digest_ref }}' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false

      - name: Install mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true
          cache: true

      - name: Azure login
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ '${{ vars.AZURE_CLIENT_ID }}' }}
          tenant-id: ${{ '${{ vars.AZURE_TENANT_ID }}' }}
          subscription-id: ${{ '${{ vars.AZURE_SUBSCRIPTION_ID }}' }}

      - name: Validate protected platform inputs
        run: |
          set -euo pipefail
          missing=""
          for v in TFSTATE_RESOURCE_GROUP TFSTATE_STORAGE_ACCOUNT TFSTATE_CONTAINER TF_VAR_subscription_id TF_VAR_location TF_VAR_resource_group_name TF_VAR_container_app_environment_id TF_VAR_acr_id TF_VAR_acr_login_server PLATFORM_ACR_NAME TF_VAR_image_digest; do
            if [ -z "${!v:-}" ]; then missing="${missing} ${v}"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing protected GitHub Environment variables or build outputs:${missing}."
            exit 1
          fi

      - name: Terraform validate
        run: |
          set -euo pipefail
          {
            printf 'resource_group_name  = "%s"\n' "$TFSTATE_RESOURCE_GROUP"
            printf 'storage_account_name = "%s"\n' "$TFSTATE_STORAGE_ACCOUNT"
            printf 'container_name       = "%s"\n' "$TFSTATE_CONTAINER"
            printf 'key                  = "golden-paths/aca/${{ values.environment }}/${{ values.componentId }}.tfstate"\n'
            printf 'use_azuread_auth     = true\n'
          } > infra/backend.hcl
          mise exec -- terraform -chdir=infra init -input=false -backend-config=backend.hcl
          mise exec -- terraform -chdir=infra fmt -check
          mise exec -- terraform -chdir=infra validate

      - name: Verify signed digest before plan
        run: |
          set -euo pipefail
          az acr login --name "$PLATFORM_ACR_NAME"
          mise exec -- cosign verify \
            --certificate-identity "https://github.com/${{ values.platformRepoOwner }}/${{ values.platformRepoName }}/.github/workflows/container-build-sign.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$DIGEST_REF"

      - name: Terraform plan
        run: mise exec -- terraform -chdir=infra plan -input=false -var-file=${{ values.environment }}.tfvars -out=tfplan

      - name: Terraform apply
        run: mise exec -- terraform -chdir=infra apply -input=false -auto-approve tfplan

  deploy:
    name: Verify signature and deploy digest
    if: ${{ "${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}" }}
    needs:
      - build
      - terraform
    runs-on: self-hosted
    permissions:
      contents: read
      id-token: write
    environment: ${{ values.environment }}
    env:
      DIGEST_REF: ${{ '${{ needs.build.outputs.digest_ref }}' }}
      CONTAINER_APP_NAME: ca-${{ values.componentId }}-${{ values.environment }}
      RESOURCE_GROUP_NAME: ${{ '${{ vars.PLATFORM_RESOURCE_GROUP_NAME }}' }}
      PLATFORM_ACR_NAME: ${{ '${{ vars.PLATFORM_ACR_NAME }}' }}
      COSIGN_EXPERIMENTAL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false

      - name: Install mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true
          cache: true

      - name: Azure login
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ '${{ vars.AZURE_CLIENT_ID }}' }}
          tenant-id: ${{ '${{ vars.AZURE_TENANT_ID }}' }}
          subscription-id: ${{ '${{ vars.AZURE_SUBSCRIPTION_ID }}' }}

      - name: Verify signed digest
        run: |
          set -euo pipefail
          az acr login --name "$PLATFORM_ACR_NAME"
          mise exec -- cosign verify \
            --certificate-identity "https://github.com/${{ values.platformRepoOwner }}/${{ values.platformRepoName }}/.github/workflows/container-build-sign.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$DIGEST_REF"

      - name: Update Container App revision
        env:
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ '${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}' }}
        run: |
          set -euo pipefail
          update_args=(
            --name "$CONTAINER_APP_NAME"
            --resource-group "$RESOURCE_GROUP_NAME"
            --image "$DIGEST_REF"
          )
          if [ -n "${APPLICATIONINSIGHTS_CONNECTION_STRING:-}" ]; then
            az containerapp secret set \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --secrets "appinsights-connection-string=${APPLICATIONINSIGHTS_CONNECTION_STRING}"
            update_args+=(--set-env-vars APPLICATIONINSIGHTS_CONNECTION_STRING=secretref:appinsights-connection-string)
          fi
          az containerapp update \
            "${update_args[@]}"

  techdocs:
    if: ${{ "${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}" }}
    uses: ${{ values.platformRepoOwner }}/${{ values.platformRepoName }}/.github/workflows/techdocs-publish.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      entity_name: ${{ values.componentId }}
      environment: ${{ values.environment }}
