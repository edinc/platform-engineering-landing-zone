apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: "${{ values.componentId }}-availability"
  namespace: "${{ values.namespace }}"
  labels:
    app.kubernetes.io/name: "${{ values.componentId }}"
    app.kubernetes.io/managed-by: backstage
    team: "${{ values.teamName }}"
    product: "${{ values.productName }}"
    costCenter: "${{ values.costCenter }}"
    dataClassification: "${{ values.dataClassification }}"
spec:
  service: "${{ values.componentId }}"
  labels:
    repo: "${{ values.githubOwner }}/${{ values.repoName }}"
  slos:
    - name: availability
      objective: ${{ values.sloAvailabilityTarget }}
      description: "${{ values.componentId }} returns non-5xx responses."
      sli:
        events:
          errorQuery: sum(rate(http_server_requests_total{namespace="${{ values.namespace }}",service="${{ values.componentId }}",status=~"5.."}[{{.window}}]))
          totalQuery: sum(rate(http_server_requests_total{namespace="${{ values.namespace }}",service="${{ values.componentId }}"}[{{.window}}]))
      alerting:
        name: '${{ values.componentId | replace("-", "_") }}AvailabilityBurn'
        labels:
          severity: sev2
          team: "${{ values.teamName }}"
          product: "${{ values.productName }}"
        annotations:
          runbook_url: "https://github.com/${{ values.githubOwner }}/${{ values.repoName }}/blob/main/docs/runbook.md"
          dashboard_url: "https://grafana.platform.example.com/d/${{ values.componentId }}"
