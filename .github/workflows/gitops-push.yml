name: Reusable GitOps PR push

on:
  workflow_call:
    inputs:
      source_path:
        description: Repository-relative path containing rendered Flux manifests.
        required: true
        type: string
      target_path:
        description: Repository-relative path inside platform-cluster-state.
        required: true
        type: string
      pr_title:
        description: Pull request title.
        required: true
        type: string
      pr_body:
        description: Pull request body.
        required: false
        type: string
        default: Generated by the platform GitOps reusable workflow.
      branch_prefix:
        description: Branch prefix to create in platform-cluster-state.
        required: false
        type: string
        default: gitops
      environment:
        description: GitHub Environment that owns Azure OIDC and GitHub App variables.
        required: false
        type: string
        default: vending
      cluster_state_repo_owner:
        description: Cluster-state repository owner. Defaults to CLUSTER_STATE_REPO_OWNER or the caller owner.
        required: false
        type: string
        default: ""
      cluster_state_repo_name:
        description: Cluster-state repository name. Defaults to CLUSTER_STATE_REPO_NAME or platform-cluster-state.
        required: false
        type: string
        default: ""
      cluster_state_default_branch:
        description: Cluster-state base branch.
        required: false
        type: string
        default: main
      runs_on:
        description: Runner label. Use a VNet-integrated self-hosted runner when the seed Key Vault is private.
        required: false
        type: string
        default: self-hosted

permissions:
  contents: read
  id-token: write

jobs:
  push:
    name: Open GitOps PR
    runs-on: ${{ inputs.runs_on }}
    environment: ${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SEED_KEY_VAULT_NAME: ${{ vars.SEED_KEY_VAULT_NAME }}
      PLATFORM_VENDING_BOT_APP_ID: ${{ vars.PLATFORM_VENDING_BOT_APP_ID }}
      PLATFORM_VENDING_BOT_INSTALLATION_ID: ${{ vars.PLATFORM_VENDING_BOT_INSTALLATION_ID }}
      PLATFORM_VENDING_BOT_PRIVATE_KEY_SECRET_NAME: ${{ vars.PLATFORM_VENDING_BOT_PRIVATE_KEY_SECRET_NAME }}
      CLUSTER_STATE_REPO_OWNER_VAR: ${{ vars.CLUSTER_STATE_REPO_OWNER }}
      CLUSTER_STATE_REPO_NAME_VAR: ${{ vars.CLUSTER_STATE_REPO_NAME }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false

      - name: Azure login (OIDC)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate inputs
        id: input
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          TARGET_PATH: ${{ inputs.target_path }}
          BRANCH_PREFIX: ${{ inputs.branch_prefix }}
          INPUT_OWNER: ${{ inputs.cluster_state_repo_owner }}
          INPUT_REPO: ${{ inputs.cluster_state_repo_name }}
          INPUT_BASE: ${{ inputs.cluster_state_default_branch }}
        run: |
          set -euo pipefail
          case "$SOURCE_PATH" in ""|"."|"./"|/*|*..*|*[!A-Za-z0-9_./-]*) echo "::error::Unsafe source_path."; exit 1 ;; esac
          case "$TARGET_PATH" in ""|"."|"./"|/*|*..*|*[!A-Za-z0-9_./-]*) echo "::error::Unsafe target_path."; exit 1 ;; esac
          case "$BRANCH_PREFIX" in ""|*[!A-Za-z0-9_./-]*) echo "::error::Unsafe branch_prefix."; exit 1 ;; esac
          if [ ! -d "$SOURCE_PATH" ]; then
            echo "::error::source_path does not exist: $SOURCE_PATH"
            exit 1
          fi
          if [ -L "$SOURCE_PATH" ]; then
            echo "::error::source_path must not be a symlink."
            exit 1
          fi
          workspace_real="$(realpath "$GITHUB_WORKSPACE")"
          source_real="$(realpath "$SOURCE_PATH")"
          case "$source_real" in "$workspace_real"/*) ;; *) echo "::error::source_path must stay under a checked-out repository subdirectory."; exit 1 ;; esac
          if [ -z "$CLUSTER_STATE_REPO_OWNER_VAR" ] || [ -z "$CLUSTER_STATE_REPO_NAME_VAR" ]; then
            echo "::error::CLUSTER_STATE_REPO_OWNER and CLUSTER_STATE_REPO_NAME protected variables are required."
            exit 1
          fi
          owner="$CLUSTER_STATE_REPO_OWNER_VAR"
          repo="$CLUSTER_STATE_REPO_NAME_VAR"
          if [ -n "$INPUT_OWNER" ] && [ "$INPUT_OWNER" != "$owner" ]; then
            echo "::error::cluster_state_repo_owner must match the protected CLUSTER_STATE_REPO_OWNER variable."
            exit 1
          fi
          if [ -n "$INPUT_REPO" ] && [ "$INPUT_REPO" != "$repo" ]; then
            echo "::error::cluster_state_repo_name must match the protected CLUSTER_STATE_REPO_NAME variable."
            exit 1
          fi
          base_branch="${INPUT_BASE:-main}"
          case "$owner" in ""|*[!A-Za-z0-9_.-]*) echo "::error::Unsafe cluster-state owner."; exit 1 ;; esac
          case "$repo" in ""|*[!A-Za-z0-9_.-]*) echo "::error::Unsafe cluster-state repository."; exit 1 ;; esac
          case "$base_branch" in ""|*[!A-Za-z0-9_./-]*) echo "::error::Unsafe cluster-state default branch."; exit 1 ;; esac
          missing=()
          for v in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID SEED_KEY_VAULT_NAME PLATFORM_VENDING_BOT_APP_ID PLATFORM_VENDING_BOT_INSTALLATION_ID PLATFORM_VENDING_BOT_PRIVATE_KEY_SECRET_NAME CLUSTER_STATE_REPO_OWNER_VAR CLUSTER_STATE_REPO_NAME_VAR; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions variables: ${missing[*]}."
            exit 1
          fi
          {
            echo "owner=$owner"
            echo "repo=$repo"
            echo "base_branch=$base_branch"
            echo "source_real=$source_real"
          } >> "$GITHUB_OUTPUT"

      - name: Mint platform-vending-bot token
        id: app_token
        run: |
          set -euo pipefail
          private_key="$(az keyvault secret show \
            --vault-name "$SEED_KEY_VAULT_NAME" \
            --name "$PLATFORM_VENDING_BOT_PRIVATE_KEY_SECRET_NAME" \
            --query value -o tsv)"
          if [ -z "$private_key" ]; then
            echo "::error::GitHub App private key secret is empty."
            exit 1
          fi
          mask_multiline() {
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            echo "::add-mask::$value"
            while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::add-mask::$line"; fi
            done <<< "$1"
          }
          mask_multiline "$private_key"
          # shellcheck disable=SC2016
          jwt="$(APP_ID="$PLATFORM_VENDING_BOT_APP_ID" PRIVATE_KEY="$private_key" node -e 'const crypto = require("crypto"); const base64url = (value) => Buffer.from(JSON.stringify(value)).toString("base64url"); const now = Math.floor(Date.now() / 1000); const header = { alg: "RS256", typ: "JWT" }; const payload = { iat: now - 60, exp: now + 540, iss: process.env.APP_ID }; const unsigned = `${base64url(header)}.${base64url(payload)}`; const signer = crypto.createSign("RSA-SHA256"); signer.update(unsigned); signer.end(); process.stdout.write(`${unsigned}.${signer.sign(process.env.PRIVATE_KEY, "base64url")}`);')"
          token_response="$(curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${jwt}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/app/installations/${PLATFORM_VENDING_BOT_INSTALLATION_ID}/access_tokens" \
            -d "$(jq -n --arg repo "${{ steps.input.outputs.repo }}" '{repositories: [$repo], permissions: {contents: "write", pull_requests: "write"}}')")"
          app_token="$(jq -r '.token' <<< "$token_response")"
          if [ -z "$app_token" ] || [ "$app_token" = "null" ]; then
            echo "::error::Failed to mint platform-vending-bot installation token."
            exit 1
          fi
          echo "::add-mask::$app_token"
          echo "token=$app_token" >> "$GITHUB_OUTPUT"

      - name: Commit manifests and open PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          OWNER: ${{ steps.input.outputs.owner }}
          REPO: ${{ steps.input.outputs.repo }}
          BASE_BRANCH: ${{ steps.input.outputs.base_branch }}
          SOURCE_PATH: ${{ inputs.source_path }}
          TARGET_PATH: ${{ inputs.target_path }}
          BRANCH_PREFIX: ${{ inputs.branch_prefix }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          SOURCE_REAL: ${{ steps.input.outputs.source_real }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          git clone --depth 1 --single-branch --branch "$BASE_BRANCH" "https://x-access-token:${APP_TOKEN}@github.com/${OWNER}/${REPO}.git" "$workdir/repo"
          cd "$workdir/repo"
          branch="${BRANCH_PREFIX}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git config user.name "platform-vending-bot[bot]"
          git config user.email "platform-vending-bot[bot]@users.noreply.github.com"
          if [ -L "$TARGET_PATH" ]; then
            echo "::error::target_path must not be a symlink."
            exit 1
          fi
          mkdir -p "$TARGET_PATH"
          repo_real="$(realpath "$PWD")"
          target_real="$(realpath -m "$TARGET_PATH")"
          case "$target_real" in "$repo_real"/*) ;; *) echo "::error::target_path must stay under a cluster-state repository subdirectory."; exit 1 ;; esac
          rsync -a --delete "${SOURCE_REAL}/" "$target_real/"
          git add "$TARGET_PATH"
          if git diff --cached --quiet; then
            echo "::notice::No GitOps manifest changes to commit."
            exit 0
          fi
          git commit -m "$PR_TITLE"
          git push origin "$branch"
          gh pr create \
            --repo "${OWNER}/${REPO}" \
            --head "$branch" \
            --base "$BASE_BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY"
