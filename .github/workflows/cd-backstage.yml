name: Backstage CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_azure_smoke:
        description: Run read-only Azure checks against the deployed Backstage instance instead of publishing.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cd-backstage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Platform online gate
    runs-on: ubuntu-latest
    outputs:
      online: ${{ steps.check.outputs.online }}
    steps:
      - name: Resolve platform availability
        id: check
        env:
          PLATFORM_ONLINE: ${{ vars.PLATFORM_ONLINE }}
        run: |
          set -euo pipefail
          if [ "${PLATFORM_ONLINE}" = "true" ]; then
            echo "online=true" >> "$GITHUB_OUTPUT"
            echo "Platform online; publish and smoke jobs will run."
          else
            echo "online=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLATFORM_ONLINE != 'true'; skipping self-hosted publish/smoke jobs."
          fi

  publish-image:
    name: Publish Backstage image
    needs: gate
    if: needs.gate.outputs.online == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.run_azure_smoke))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/container-build-sign.yml
    with:
      image_name: platform/backstage
      context: backstage/app
      dockerfile: backstage/app/Dockerfile
      # This heavy Node.js image runs only on x86-64 AKS demo nodes; avoid slow QEMU arm64 emulation.
      platforms: linux/amd64
      environment: dev

  publish-reconciler-image:
    name: Publish Backstage catalog reconciler image
    needs: gate
    if: needs.gate.outputs.online == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.run_azure_smoke))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/container-build-sign.yml
    with:
      image_name: platform/backstage-catalog-reconciler
      context: backstage/catalog-reconciler
      dockerfile: backstage/catalog-reconciler/Dockerfile
      environment: dev

  publish-chart:
    name: Publish Backstage chart
    if: needs.gate.outputs.online == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.run_azure_smoke))
    permissions:
      contents: read
      id-token: write
    needs:
      - gate
      - publish-image
      - publish-reconciler-image
    uses: ./.github/workflows/helm-publish.yml
    with:
      chart_path: backstage/deploy
      environment: dev
      oci_repository: helm

  deployment-values:
    name: Backstage deployment values
    if: needs.gate.outputs.online == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.run_azure_smoke))
    runs-on: ubuntu-latest
    needs:
      - gate
      - publish-image
      - publish-reconciler-image
      - publish-chart
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Summarize Terraform inputs
        env:
          BACKSTAGE_IMAGE_DIGEST_REF: ${{ needs.publish-image.outputs.digest_ref }}
          BACKSTAGE_CATALOG_RECONCILER_IMAGE_DIGEST_REF: ${{ needs.publish-reconciler-image.outputs.digest_ref }}
          BACKSTAGE_CHART_DIGEST_REF: ${{ needs.publish-chart.outputs.digest_ref }}
        run: |
          set -euo pipefail
          missing=()
          for v in BACKSTAGE_IMAGE_DIGEST_REF BACKSTAGE_CATALOG_RECONCILER_IMAGE_DIGEST_REF BACKSTAGE_CHART_DIGEST_REF; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing reusable workflow outputs: ${missing[*]}."
            exit 1
          fi
          backstage_image_digest="${BACKSTAGE_IMAGE_DIGEST_REF##*@}"
          reconciler_image_digest="${BACKSTAGE_CATALOG_RECONCILER_IMAGE_DIGEST_REF##*@}"
          backstage_chart_digest="${BACKSTAGE_CHART_DIGEST_REF##*@}"
          backstage_chart_version="$(awk -F': *' '$1 == "version" {print $2; exit}' backstage/deploy/Chart.yaml)"
          {
            echo "### Backstage platform Terraform inputs"
            echo
            echo "Use these values in the protected platform Terraform tfvars JSON, then dispatch **Deploy infrastructure stack** with \`stack=platform\`."
            echo
            echo '```json'
            printf '{\n'
            printf '  "backstage_image_digest": "%s",\n' "$backstage_image_digest"
            printf '  "backstage_catalog_reconciler_image_digest": "%s",\n' "$reconciler_image_digest"
            printf '  "backstage_chart_digest": "%s",\n' "$backstage_chart_digest"
            printf '  "backstage_chart_version": "%s",\n' "$backstage_chart_version"
            printf '  "enable_backstage": true,\n'
            printf '  "enable_gitops": true,\n'
            printf '  "enable_techdocs_storage": true\n'
            printf '}\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  azure-smoke:
    name: Deployed Backstage smoke
    needs: gate
    if: needs.gate.outputs.online == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.run_azure_smoke
    runs-on: [self-hosted, azure, private-acr, swedencentral]
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      PLATFORM_RESOURCE_GROUP_NAME: ${{ vars.PLATFORM_RESOURCE_GROUP_NAME }}
      PLATFORM_AKS_CLUSTER_NAME: ${{ vars.PLATFORM_AKS_CLUSTER_NAME }}
      TECHDOCS_STORAGE_ACCOUNT_NAME: ${{ vars.TECHDOCS_STORAGE_ACCOUNT_NAME }}
      TECHDOCS_STORAGE_CONTAINER_NAME: ${{ vars.TECHDOCS_STORAGE_CONTAINER_NAME || 'techdocs' }}
      BACKSTAGE_HOST: ${{ vars.BACKSTAGE_HOST }}
      BACKSTAGE_RESOLVE_IP: ${{ vars.BACKSTAGE_RESOLVE_IP }}
      BACKSTAGE_CLUSTER_READINESS: ${{ vars.BACKSTAGE_CLUSTER_READINESS || 'true' }}
      BACKSTAGE_TRUST_PRIVATE_CA: ${{ vars.BACKSTAGE_TRUST_PRIVATE_CA || 'false' }}
      BACKSTAGE_TLS_CA_KEY_VAULT_NAME: ${{ vars.BACKSTAGE_TLS_CA_KEY_VAULT_NAME }}
      BACKSTAGE_TLS_CA_SECRET_NAME: ${{ vars.BACKSTAGE_TLS_CA_SECRET_NAME || 'platform-private-ca-crt' }}
      AZURE_CONFIG_DIR: ${{ github.workspace }}/.tools/tmp/azure-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true
          cache: true

      - name: Azure login (OIDC)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deployed Backstage
        run: bash scripts/azure/validate_backstage_azure.sh

      - name: Remove Azure CLI cache
        if: ${{ always() }}
        run: rm -rf "$AZURE_CONFIG_DIR"

  environment-reference:
    name: Environment protection reference
    if: github.event_name == 'workflow_dispatch'
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          - dev
          - nonprod
          - prod
    environment: ${{ matrix.environment }}
    steps:
      - name: Reference protected environment
        run: |
          echo "Referenced ${{ matrix.environment }} for Backstage deployment controls."
