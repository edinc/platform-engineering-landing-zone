name: Reusable Terraform plan/apply

on:
  workflow_call:
    inputs:
      stack_path:
        description: Repository-relative Terraform stack path.
        required: true
        type: string
      environment:
        description: GitHub Environment that owns the Azure OIDC variables.
        required: true
        type: string
      backend_key:
        description: Remote-state key. Omit only for validation-only plans.
        required: false
        type: string
        default: ""
      backend_container:
        description: Remote-state container for the selected stack. Defaults to TFSTATE_CONTAINER when empty.
        required: false
        type: string
        default: ""
      plan_name:
        description: Local Terraform plan file name.
        required: false
        type: string
        default: tfplan
      apply:
        description: Apply the generated plan. Applies are restricted to main.
        required: false
        type: boolean
        default: false
      tfvars_json_variable:
        description: Optional GitHub Environment variable name containing a JSON object of non-secret Terraform inputs.
        required: false
        type: string
        default: ""
      tfvars_json_secret:
        description: Optional GitHub Environment secret name containing a JSON object of sensitive Terraform inputs.
        required: false
        type: string
        default: ""
      replace_addresses:
        description: Optional whitespace- or comma-separated Terraform resource addresses to pass as -replace arguments for approved recovery operations.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  untrusted-pr:
    name: Terraform PR validation
    if: ${{ github.event_name == 'pull_request' && !inputs.apply }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false

      - name: Install mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true
          cache: true

      - name: Validate untrusted PR inputs
        env:
          STACK_PATH: ${{ inputs.stack_path }}
          BACKEND_KEY: ${{ inputs.backend_key }}
          BACKEND_CONTAINER: ${{ inputs.backend_container }}
          PLAN_NAME: ${{ inputs.plan_name }}
          TFVARS_JSON_VARIABLE_NAME: ${{ inputs.tfvars_json_variable }}
          TFVARS_JSON_SECRET_NAME: ${{ inputs.tfvars_json_secret }}
          REPLACE_ADDRESSES: ${{ inputs.replace_addresses }}
        run: |
          set -euo pipefail
          case "$STACK_PATH" in
            ""|/*|*..*|*[!A-Za-z0-9_./-]*)
              echo "::error::Unsafe stack_path: $STACK_PATH"
              exit 1
              ;;
          esac
          if [ ! -d "$STACK_PATH" ]; then
            echo "::error::Terraform stack path does not exist: $STACK_PATH"
            exit 1
          fi
          case "$PLAN_NAME" in
            ""|*/*|*..*|*[!A-Za-z0-9_.-]*)
              echo "::error::Unsafe plan_name: $PLAN_NAME"
              exit 1
              ;;
          esac
          if [ -n "$BACKEND_KEY" ]; then
            echo "::error::Pull-request Terraform validation cannot use remote backend or Azure OIDC. Re-run a protected branch workflow for Azure-backed plans."
            exit 1
          fi
          if [ -n "$BACKEND_CONTAINER" ]; then
            echo "::error::Pull-request Terraform validation cannot use remote backend containers. Re-run a protected branch workflow for Azure-backed plans."
            exit 1
          fi
          for name in "$TFVARS_JSON_VARIABLE_NAME" "$TFVARS_JSON_SECRET_NAME"; do
            if [ -n "$name" ]; then
              case "$name" in
                *[!A-Z0-9_]*)
                  echo "::error::tfvars_json_variable and tfvars_json_secret must be empty or uppercase GitHub variable/secret names."
                  exit 1
                  ;;
              esac
            fi
          done
          if [ -n "$REPLACE_ADDRESSES" ]; then
            echo "::error::Pull-request Terraform validation cannot use Terraform -replace arguments. Re-run a protected branch workflow for recovery operations."
            exit 1
          fi

      - name: Terraform init without backend
        env:
          STACK_PATH: ${{ inputs.stack_path }}
        run: mise exec -- terraform -chdir="$STACK_PATH" init -backend=false -input=false

      - name: Terraform validate
        env:
          STACK_PATH: ${{ inputs.stack_path }}
        run: mise exec -- terraform -chdir="$STACK_PATH" validate

      - name: Terraform speculative plan without refresh
        env:
          STACK_PATH: ${{ inputs.stack_path }}
          PLAN_NAME: ${{ inputs.plan_name }}
        run: mise exec -- terraform -chdir="$STACK_PATH" plan -refresh=false -lock=false -input=false -out="$PLAN_NAME"

  trusted:
    name: Terraform ${{ inputs.apply && 'apply' || 'plan' }}
    if: ${{ github.event_name != 'pull_request' || inputs.apply }}
    runs-on: [self-hosted, azure, private-acr, swedencentral]
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      AZURE_CONFIG_DIR: ${{ github.workspace }}/.tools/tmp/azure-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false

      - name: Install mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true
          cache: true

      - name: Validate trusted inputs and environment
        env:
          STACK_PATH: ${{ inputs.stack_path }}
          BACKEND_KEY: ${{ inputs.backend_key }}
          BACKEND_CONTAINER: ${{ inputs.backend_container }}
          PLAN_NAME: ${{ inputs.plan_name }}
          TFVARS_JSON_VARIABLE_NAME: ${{ inputs.tfvars_json_variable }}
          TFVARS_JSON_SECRET_NAME: ${{ inputs.tfvars_json_secret }}
          REPLACE_ADDRESSES: ${{ inputs.replace_addresses }}
        run: |
          set -euo pipefail
          case "$STACK_PATH" in
            ""|/*|*..*|*[!A-Za-z0-9_./-]*)
              echo "::error::Unsafe stack_path: $STACK_PATH"
              exit 1
              ;;
          esac
          if [ ! -d "$STACK_PATH" ]; then
            echo "::error::Terraform stack path does not exist: $STACK_PATH"
            exit 1
          fi
          case "$PLAN_NAME" in
            ""|*/*|*..*|*[!A-Za-z0-9_.-]*)
              echo "::error::Unsafe plan_name: $PLAN_NAME"
              exit 1
              ;;
          esac
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Azure-backed Terraform plan/apply is allowed only from refs/heads/main."
            exit 1
          fi
          if [ -z "$BACKEND_KEY" ]; then
            echo "::error::backend_key is required for trusted Azure-backed Terraform plans and applies."
            exit 1
          fi
          case "$BACKEND_KEY" in
            ""|/*|*..*|*[!A-Za-z0-9_./-]*)
              echo "::error::Unsafe backend_key: $BACKEND_KEY"
              exit 1
              ;;
          esac
          missing=()
          for v in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID TFSTATE_RESOURCE_GROUP TFSTATE_STORAGE_ACCOUNT; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          backend_container="${BACKEND_CONTAINER:-${TFSTATE_CONTAINER:-}}"
          if [ -z "$backend_container" ]; then
            missing+=(backend_container_or_TFSTATE_CONTAINER)
          fi
          case "$backend_container" in
            ""|/*|*..*|*[!A-Za-z0-9_-]*)
              echo "::error::Unsafe backend container: $backend_container"
              exit 1
              ;;
          esac
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions variables: ${missing[*]}."
            exit 1
          fi
          for name in "$TFVARS_JSON_VARIABLE_NAME" "$TFVARS_JSON_SECRET_NAME"; do
            if [ -n "$name" ]; then
              case "$name" in
                *[!A-Z0-9_]*)
                  echo "::error::tfvars_json_variable and tfvars_json_secret must be empty or uppercase GitHub variable/secret names."
                  exit 1
                  ;;
              esac
            fi
          done
          replace_args_file="$STACK_PATH/.terraform-replace-args"
          : > "$replace_args_file"
          if [ -n "$REPLACE_ADDRESSES" ]; then
            if [ "$STACK_PATH" != "infrastructure/terraform/platform" ]; then
              echo "::error::Terraform -replace arguments are only approved for the platform Flux extension recovery path."
              exit 1
            fi
            replace_addresses="${REPLACE_ADDRESSES//,/ }"
            for address in $replace_addresses; do
              case "$address" in
                azurerm_kubernetes_flux_configuration.backstage[0]|azurerm_kubernetes_flux_configuration.platform[0]|azurerm_kubernetes_cluster_extension.flux[0])
                  printf -- '-replace=%s\n' "$address" >> "$replace_args_file"
                  ;;
                *)
                  echo "::error::Terraform -replace address is not approved for Flux extension recovery: $address"
                  exit 1
                  ;;
              esac
            done
          fi

      - name: Azure login (OIDC)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        env:
          STACK_PATH: ${{ inputs.stack_path }}
          BACKEND_KEY: ${{ inputs.backend_key }}
          BACKEND_CONTAINER: ${{ inputs.backend_container }}
        run: |
          set -euo pipefail
          backend_container="${BACKEND_CONTAINER:-$TFSTATE_CONTAINER}"
          {
            printf 'resource_group_name  = "%s"\n' "$TFSTATE_RESOURCE_GROUP"
            printf 'storage_account_name = "%s"\n' "$TFSTATE_STORAGE_ACCOUNT"
            printf 'container_name       = "%s"\n' "$backend_container"
            printf 'key                  = "%s"\n' "$BACKEND_KEY"
            printf 'use_azuread_auth     = true\n'
          } > "$STACK_PATH/backend.hcl"
          mise exec -- terraform -chdir="$STACK_PATH" init -input=false -backend-config=backend.hcl

      - name: Materialize Terraform variables
        env:
          STACK_PATH: ${{ inputs.stack_path }}
          TFVARS_JSON_VARIABLE_NAME: ${{ inputs.tfvars_json_variable }}
          TFVARS_JSON_VARIABLE_VALUE: ${{ vars[inputs.tfvars_json_variable] }}
          TFVARS_JSON_SECRET_NAME: ${{ inputs.tfvars_json_secret }}
          TFVARS_JSON_SECRET_VALUE: ${{ secrets[inputs.tfvars_json_secret] }}
        run: |
          set -euo pipefail
          write_tfvars_json() {
            local name="$1"
            local value="$2"
            local path="$3"
            if [ -z "$name" ]; then
              return 0
            fi
            if [ -z "$value" ]; then
              echo "::error::GitHub variable/secret '$name' is empty or not available in the '${{ inputs.environment }}' environment."
              exit 1
            fi
            TFVARS_JSON_CONTENT="$value" TFVARS_JSON_PATH="$path" mise exec -- python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(os.environ["TFVARS_JSON_CONTENT"])
          if not isinstance(data, dict):
              raise SystemExit("Terraform tfvars JSON must be a top-level object.")
          Path(os.environ["TFVARS_JSON_PATH"]).write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            echo "Wrote Terraform input file from $name."
          }

          write_tfvars_json "$TFVARS_JSON_VARIABLE_NAME" "$TFVARS_JSON_VARIABLE_VALUE" "$STACK_PATH/zz-workflow.auto.tfvars.json"
          write_tfvars_json "$TFVARS_JSON_SECRET_NAME" "$TFVARS_JSON_SECRET_VALUE" "$STACK_PATH/zz-workflow-secret.auto.tfvars.json"

      - name: Terraform validate
        env:
          STACK_PATH: ${{ inputs.stack_path }}
        run: mise exec -- terraform -chdir="$STACK_PATH" validate

      - name: Terraform plan
        env:
          STACK_PATH: ${{ inputs.stack_path }}
          PLAN_NAME: ${{ inputs.plan_name }}
        run: |
          replace_args=()
          if [ -s "$STACK_PATH/.terraform-replace-args" ]; then
            mapfile -t replace_args < "$STACK_PATH/.terraform-replace-args"
          fi
          set +e
          mise exec -- terraform -chdir="$STACK_PATH" plan "${replace_args[@]}" -detailed-exitcode -input=false -lock-timeout=120s -out="$PLAN_NAME"
          plan_exit=$?
          set -e
          case "$plan_exit" in
            0)
              echo "Terraform plan completed with no changes."
              ;;
            2)
              echo "Terraform plan completed with changes."
              ;;
            *)
              exit "$plan_exit"
              ;;
          esac

      - name: Terraform apply
        if: ${{ inputs.apply }}
        env:
          STACK_PATH: ${{ inputs.stack_path }}
          PLAN_NAME: ${{ inputs.plan_name }}
        run: mise exec -- terraform -chdir="$STACK_PATH" apply -input=false -lock-timeout=120s "$PLAN_NAME"

      - name: Remove materialized Terraform variables and Azure CLI cache
        if: ${{ always() }}
        env:
          STACK_PATH: ${{ inputs.stack_path }}
        run: |
          rm -f "$STACK_PATH"/zz-workflow.auto.tfvars.json "$STACK_PATH"/zz-workflow-secret.auto.tfvars.json "$STACK_PATH"/.terraform-replace-args
          rm -rf "$AZURE_CONFIG_DIR"
