name: Backstage CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Backstage app contract
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 22.x
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.4.1 --activate

      - name: Install Backstage app dependencies
        working-directory: backstage/app
        run: yarn install --immutable

      - name: Test Backstage app
        working-directory: backstage/app
        run: yarn test

      - name: Build Backstage app
        working-directory: backstage/app
        run: yarn tsc && yarn build:backend

  helm:
    name: Backstage Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true
          cache: true

      - name: Lint Backstage Helm chart
        run: mise exec -- helm lint backstage/deploy

  contract:
    name: Stage 09 contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate Stage 09 contracts
        run: python3 scripts/backstage/validate_stage09_backstage.py

  publish-image:
    name: Publish Backstage image
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    needs:
      - app
      - contract
    uses: ./.github/workflows/container-build-sign.yml
    with:
      image_name: platform/backstage
      context: backstage/app
      dockerfile: backstage/app/Dockerfile
      environment: dev

  publish-reconciler-image:
    name: Publish Backstage catalog reconciler image
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    needs:
      - contract
    uses: ./.github/workflows/container-build-sign.yml
    with:
      image_name: platform/backstage-catalog-reconciler
      context: backstage/catalog-reconciler
      dockerfile: backstage/catalog-reconciler/Dockerfile
      environment: dev

  publish-chart:
    name: Publish Backstage chart
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    needs:
      - helm
      - publish-image
      - publish-reconciler-image
    uses: ./.github/workflows/helm-publish.yml
    with:
      chart_path: backstage/deploy
      environment: dev
      oci_repository: helm

  environment-reference:
    name: Environment protection reference
    if: github.event_name == 'workflow_dispatch'
    needs:
      - app
      - helm
      - contract
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          - dev
          - nonprod
          - prod
    environment: ${{ matrix.environment }}
    steps:
      - name: Reference protected environment
        run: |
          echo "Referenced ${{ matrix.environment }} for Stage 09 Backstage deployment controls."
