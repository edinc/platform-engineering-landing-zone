name: Backstage CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-stub:
    name: Node.js 20 pnpm stub
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 20.x
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Stage 00 Backstage placeholder
        run: |
          if [ -f backstage/app/package.json ]; then
            cd backstage/app
            pnpm install --frozen-lockfile
            pnpm test
            pnpm build
          else
            echo "Backstage application is introduced in Stage 09; Stage 00 validates the CI stub only."
          fi

  environment-stub:
    name: Environment protection stub
    if: github.event_name == 'workflow_dispatch'
    needs: node-stub
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          - bootstrap
          - dev
          - nonprod
          - prod
    environment: ${{ matrix.environment }}
    steps:
      - name: Reference protected environment
        run: echo "Referenced ${{ matrix.environment }} for Stage 00 environment setup."
