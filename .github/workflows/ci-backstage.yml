name: Backstage CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Backstage app contract
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 22.x
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.4.1 --activate

      - name: Install Backstage app dependencies
        working-directory: backstage/app
        run: yarn install --immutable

      - name: Test Backstage app
        working-directory: backstage/app
        run: yarn test

      - name: Build Backstage app
        working-directory: backstage/app
        run: yarn tsc && yarn build:backend

  helm:
    name: Backstage Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true
          cache: true

      - name: Lint Backstage Helm chart
        run: mise exec -- helm lint backstage/deploy

  contract:
    name: Backstage contract validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate Backstage contracts
        run: python3 scripts/backstage/validate_backstage.py
